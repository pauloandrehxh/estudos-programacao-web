<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <title>Receita 5 - Arrow Functions</title>
    <style>
        table {
            border-collapse: collapse;
            width: 300px;
            margin-top: 20px;
            font-family: Arial;
        }

        th,
        td {
            border: 1px solid black;
            padding: 10px;
            text-align: center;
        }

        th {
            background-color: #2c3e50;
            color: white;
        }

        /* Estilizando os links para ficarem parecidos com botões ou textos clicáveis */
        .meus-links {
            display: inline-block;
            margin-right: 15px;
            color: blue;
            cursor: pointer;
            text-decoration: underline;
        }
    </style>
</head>

<body>
    <a class="meus-links" id="linkCarregar">Carregar Filmes</a>
    <a class="meus-links" id="linkOrdenar">Ordenar</a>
    <a class="meus-links" id="linkEmbaralhar">Embaralhar</a>

    <div id="area-tabela"></div>

    <script>
        const filmes = ["Matrix", "O Poderoso Chefão", "Pulp Fiction", "Clube da Luta"];

        const carregarDiv = (lista) => {
            const div = document.getElementById("area-tabela");

            const linhasHtml = lista.map(item => `<tr><td>${item}</td></tr>`);

            div.innerHTML = `<table><tr><th>Filmes Clássicos</th></tr>${linhasHtml.join("\n")}</table>`;
        };

        const ordenarLista = () => {
            filmes.sort();
            carregarDiv(filmes);
        };

        const embaralharLista = () => {
            // Arrow function usada novamente como callback anônima para o sort
            filmes.sort(() => Math.random() - 0.5);
            carregarDiv(filmes);
        };

        // Como o 'carregarDiv' agora exige um parâmetro, precisamos usar uma arrow function 
        // vazia () => apenas para empurrar o parâmetro filmes para dentro dela no momento do clique.
        document.getElementById("linkCarregar").addEventListener("click", () => carregarDiv(filmes));
        document.getElementById("linkOrdenar").addEventListener("click", ordenarLista);
        document.getElementById("linkEmbaralhar").addEventListener("click", embaralharLista);
    </script>
</body>

</html>
